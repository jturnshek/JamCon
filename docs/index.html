<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JamCon - Joy-Con Mouse for macOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #f5f5f7;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2.5rem;
        }
        .install-section {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }
        .install-section h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 0.75rem;
        }
        .install-code {
            background: #1d1d1f;
            color: #fff;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            font-family: 'SF Mono', Menlo, Monaco, monospace;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .install-code:hover {
            background: #2d2d2f;
        }
        .install-code:active {
            background: #3d3d3f;
        }
        .copied {
            font-size: 0.8rem;
            color: #34c759;
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .copied.show {
            opacity: 1;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        .links a {
            color: #0066cc;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .requirements {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JamCon</h1>
        <p class="tagline">Use your Nintendo Joy-Con as a wireless mouse for macOS</p>

        <div class="install-section">
            <h2>Install with Homebrew</h2>
            <div class="install-code" onclick="copyToClipboard()">
                brew install --cask jamcon
            </div>
            <p class="copied" id="copied">Copied!</p>
        </div>

        <div class="links">
            <a href="https://github.com/jturnshek/JamCon">GitHub</a>
            <a href="https://github.com/jturnshek/JamCon#readme">Documentation</a>
        </div>

        <p class="requirements">Requires macOS 14+ and a Joy-Con controller</p>
    </div>

    <script>
        function copyToClipboard() {
            navigator.clipboard.writeText('brew install --cask jamcon');
            const copied = document.getElementById('copied');
            copied.classList.add('show');
            setTimeout(() => copied.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
