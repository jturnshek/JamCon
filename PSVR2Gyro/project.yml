name: PSVR2Gyro
options:
  bundleIdPrefix: com.psvr2gyro
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: PSVR2Gyro
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  PSVR2Gyro:
    type: application
    platform: macOS
    sources:
      - path: Sources/PSVR2Gyro
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psvr2gyro.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PSVR2Gyro.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        # Menu bar app settings
        LSUIElement: YES

schemes:
  PSVR2Gyro:
    build:
      targets:
        PSVR2Gyro: all
    run:
      config: Debug
    archive:
      config: Release
