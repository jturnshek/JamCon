name: JamCon
options:
  bundleIdPrefix: com.jamcon
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: JamCon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  JamCon:
    type: application
    platform: macOS
    sources:
      - path: Sources/JamCon
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamcon.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/JamCon.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

  JamConTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/JamConTests
        type: group
    dependencies:
      - target: JamCon
    settings:
      base:
        PRODUCT_NAME: JamConTests
        PRODUCT_BUNDLE_IDENTIFIER: com.jamcon.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  JamCon:
    build:
      targets:
        JamCon: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JamConTests
      preActions:
        - name: Reset Isolated Test Preferences
          settingsTarget: JamCon
          script: |
            rm -rf "$TEMP_DIR/JamConTestsHome"
            mkdir -p "$TEMP_DIR/JamConTestsHome/Library/Preferences"
      environmentVariables:
        CFFIXED_USER_HOME: "$(TEMP_DIR)/JamConTestsHome"
    archive:
      config: Release
