name: JamCon
options:
  bundleIdPrefix: com.jamcon
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: JamCon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  JamCon:
    type: application
    platform: macOS
    sources:
      - path: Sources/JamCon
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamcon.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/JamCon.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

schemes:
  JamCon:
    build:
      targets:
        JamCon: all
    run:
      config: Debug
    archive:
      config: Release
