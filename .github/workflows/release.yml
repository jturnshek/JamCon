name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.NOTARIZATION_PASSWORD != '' }}
    runs-on: macos-14  # Apple Silicon runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Import Certificates
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm certificate.p12

      - name: Build Release
        run: |
          xcodebuild -scheme JamCon -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Sign with Entitlements
        run: |
          codesign --force --sign "Developer ID Application" \
            --entitlements Resources/JamCon.entitlements \
            --options runtime \
            build/Build/Products/Release/JamCon.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent build/Build/Products/Release/JamCon.app JamCon.zip

          # Submit and wait
          xcrun notarytool submit JamCon.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --wait

          # Staple
          xcrun stapler staple build/Build/Products/Release/JamCon.app

      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          create-dmg \
            --volname "JamCon" \
            --volicon "Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "JamCon.app" 130 200 \
            --hide-extension "JamCon.app" \
            --app-drop-link 410 200 \
            "JamCon-${VERSION}.dmg" \
            "build/Build/Products/Release/JamCon.app" || true

          # Sign the DMG
          codesign --force --sign "Developer ID Application" "JamCon-${VERSION}.dmg"

      - name: Create ZIP Archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ditto -c -k --keepParent build/Build/Products/Release/JamCon.app \
            "JamCon-${VERSION}.zip"

      - name: Calculate SHA256
        id: sha
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DMG_SHA=$(shasum -a 256 "JamCon-${VERSION}.dmg" | awk '{print $1}')
          ZIP_SHA=$(shasum -a 256 "JamCon-${VERSION}.zip" | awk '{print $1}')
          echo "dmg_sha256=${DMG_SHA}" >> $GITHUB_OUTPUT
          echo "zip_sha256=${ZIP_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            JamCon-*.dmg
            JamCon-*.zip
          body: |
            ## JamCon ${{ steps.sha.outputs.version }}

            ### Installation
            1. Download `JamCon-${{ steps.sha.outputs.version }}.dmg`
            2. Open the DMG and drag JamCon to Applications
            3. Launch JamCon and grant Accessibility permission when prompted

            **Apple Silicon (arm64) only**

            ### Homebrew
            ```bash
            brew tap jturnshek/tap
            brew install --cask jamcon
            ```

            ### SHA256 Checksums
            ```
            DMG: ${{ steps.sha.outputs.dmg_sha256 }}
            ZIP: ${{ steps.sha.outputs.zip_sha256 }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
